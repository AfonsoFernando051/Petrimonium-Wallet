name: Wallet CI

# This repository *is* the wallet app — its root holds pubspec.yaml — so every
# path here is repo-root-relative. There is no "Petrimonium-Wallet/"
# subdirectory to filter on or cd into.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `channel: stable`: a floating channel both drifts
      # CI onto untested Flutter releases out from under this codebase and,
      # combined with `cache: true`, risks pinning a *stale/broken* cached SDK
      # to that same never-changing "stable" cache key with no way to bust it
      # short of an SDK bump. A version pin gives every run a cache key tied
      # to a specific, locally-verified SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          cache: true
          cache-key: "flutter-wallet-3.41.4-v2"

      - name: Verify Flutter version
        run: |
          flutter --version
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `channel: stable`: a floating channel both drifts
      # CI onto untested Flutter releases out from under this codebase and,
      # combined with `cache: true`, risks pinning a *stale/broken* cached SDK
      # to that same never-changing "stable" cache key with no way to bust it
      # short of an SDK bump. A version pin gives every run a cache key tied
      # to a specific, locally-verified SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          cache: true
          cache-key: "flutter-wallet-3.41.4-v2"

      # integration_test's flows drive the real MyApp widget tree via the
      # Linux desktop target (`-d linux`) — Flutter's web target explicitly
      # doesn't support `flutter test` for integration_test, and there's no
      # emulator/simulator here — which needs the GTK desktop toolchain and
      # a display to render into (ubuntu-latest has neither by default).
      # libsecret-1-dev: required by the flutter_secure_storage_linux plugin's
      # native CMake build (pkg_check_modules REQUIRED libsecret-1).
      # libcurl4-openssl-dev: required by sentry-native (vendored via CMake
      # FetchContent) — its default Linux transport is curl, which
      # unconditionally does find_package(CURL REQUIRED).
      # Both fail CMake configure before any Dart code even runs.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libcurl4-openssl-dev xvfb
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Integration (E2E) tests
        # -Wno-error=unknown-warning-option: vendored native deps (sentry-native, flutter_secure_storage)
        # pass -Werror=nontrivial-memcall which GCC 13 (ubuntu-latest default) does not recognise,
        # causing the CMake build to abort before any Dart code runs. This flag makes GCC silently
        # ignore unknown -Werror=<flag> options without suppressing any real warnings.
        env:
          CFLAGS: "-Wno-error=unknown-warning-option"
          CXXFLAGS: "-Wno-error=unknown-warning-option"
        run: xvfb-run -a flutter test -d linux integration_test
